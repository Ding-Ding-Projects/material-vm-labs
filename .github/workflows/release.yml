# A real release on every push to main: builds the portable apps, the unsigned Squirrel installer,
# the zip and the phone PDF of the docs, then publishes one uniquely tagged GitHub release with a
# dim sum code name, the project's line count, a labelled human time estimate from that same count
# and the measured workflow timing. No test or lint
# job gates it; the build workflow runs the tests on the same commit.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      MVL_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Give this release its own package version
        shell: pwsh
        # Squirrel only applies a package whose version is newer than the installed one, and compares
        # prerelease labels as text, so the run number is zero-padded.
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $v = '{0}-build{1:D5}' -f $base, ${{ github.run_number }}
          Set-Content -Path VERSION -Value $v -NoNewline
          "MVL_PACKAGE_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
      - name: build.bat /s
        shell: cmd
        run: build.bat /s
      - name: build-installer.bat /s
        shell: cmd
        run: build-installer.bat /s
      - name: Phone PDF edition of the documentation
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install chromium
          node scripts/build-site.mjs
          node scripts/build-docs-pdf.mjs
          Copy-Item site/dist/material-vm-labs-docs.pdf dist/
      - name: Check every setup executable is unsigned
        shell: pwsh
        run: |
          foreach ($e in Get-ChildItem -Recurse -Path dist, companion/out -Filter *.exe) {
            if ((Get-AuthenticodeSignature -FilePath $e.FullName).Status -ne 'NotSigned') { throw "$($e.Name) is signed; releases are unsigned by design." }
          }
      - name: Line count and code name
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/count-lines.mjs | Out-File -Encoding utf8 lines.md
          # The human time estimate reads the same counter at the same commit in this same job.
          node scripts/count-lines.mjs --json | Out-File -Encoding utf8 lines.json
          node scripts/human-time-estimate.mjs lines.json | Out-File -Encoding utf8 estimate.md
          node scripts/dim-sum-code-name.mjs | Out-File -Encoding utf8 codename.json
          Get-Content codename.json
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version-build.${{ github.run_number }}"
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.exe', '.pdf' }) +
                   @(Get-ChildItem dist/installer -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.exe', '.nupkg' -or $_.Name -eq 'RELEASES' })
          if (-not ($files | Where-Object { $_.Name -eq 'RELEASES' })) { throw 'The Squirrel installer (Setup exe, nupkg, RELEASES) is missing from dist/installer.' }
          $hashes = ($files | ForEach-Object { "| $($_.Name) | $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()) |" }) -join "`n"
          $cn = Get-Content codename.json -Raw | ConvertFrom-Json
          if ($cn.codeName) {
            $codeLines = "Code name: **$($cn.codeName)**, from the public dim sum catalogue. [Photo of $($cn.en)]($($cn.photoUrl)) ($($cn.alt)).`nCode name dish id: ``$($cn.id)``"
          } else { $codeLines = "No code name for this build: $($cn.reason). Released with the version alone." }
          # Timing runs from the first job's startedAt to this final publication step.
          $jobs = gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" | ConvertFrom-Json
          $start = ($jobs.jobs | ForEach-Object { ([datetime]$_.started_at).ToUniversalTime() } | Sort-Object | Select-Object -First 1)
          $end = (Get-Date).ToUniversalTime()
          $dur = $end - $start
          $lines = Get-Content lines.md -Raw
          $estimate = Get-Content estimate.md -Raw
          $notes = @(
            "Material VM Labs $version, build ${{ github.run_number }}, commit ``${{ github.sha }}``.",
            '',
            $codeLines,
            '',
            'Unsigned build: Windows SmartScreen may warn because the files are not code-signed.',
            '',
            'Checks: this release workflow runs no tests or lint by design. The `build` workflow runs the offline test suite on the same commit; see its result in the Actions tab before relying on this build.',
            '',
            '| File | SHA-256 |', '| --- | --- |', $hashes,
            '',
            '## Lines of code', '', $lines,
            '',
            '## How long a person would take (estimate)', '', $estimate,
            'Reproduce: `node scripts/count-lines.mjs --json > lines.json` then `node scripts/human-time-estimate.mjs lines.json`.',
            '',
            "Workflow started: $($start.ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            "Workflow completed: $($end.ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            "Workflow duration: $('{0:00}:{1:00}:{2:00}' -f [math]::Floor($dur.TotalHours), $dur.Minutes, $dur.Seconds)"
          ) -join "`n"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create $tag --target "${{ github.sha }}" --title "Material VM Labs $version build ${{ github.run_number }}" --notes-file notes.md $files.FullName
          gh release view $tag --json tagName,isDraft,assets --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'
