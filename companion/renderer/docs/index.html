<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>lab machine Docs</title>
<link rel="stylesheet" href="../shared/mvl.css">
<link rel="stylesheet" href="docs.css">
</head>
<body>
<div class="dragbar" aria-hidden="true"></div>
<a class="skip" href="#reader">Skip to the documentation</a>
<div class="shell">
  <nav class="pillar" id="pillar" aria-label="Documentation topics">
    <a class="mark" href="#/" aria-label="Start here"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0B0F11" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 5 14h6l-1 8 8-12h-6z"></path></svg></a>
    <span class="plabel">DOCS</span>
    <div class="gauge" role="img" aria-label="Reading progress this session"></div>
    <div class="cells"></div>
    <span class="pillar-grow"></span>
    <button class="btn sm" id="theme" type="button" aria-label="Toggle light and dark theme">Theme</button>
    <span class="hvchip" role="status">Bundled offline</span>
  </nav>
  <div class="stage">
    <div id="reader" class="page"></div>
  </div>
</div>
<script src="../shared/common.js"></script>
<script src="../shared/docs-reader.js"></script>
<script src="app.js"></script>
</body>
</html>
