<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.app{--p:#6750a4;--on-p:#fff;--pc:#e9ddff;--on-pc:#22005d;--sc:#e8def8;--on-sc:#1e192b;--tc:#ffd9e3;--on-tc:#31101d;--sf:#fffbff;--on-sf:#1c1b1e;--mute:#49454e;--ol:#7a757f;--olv:#cac4cf;--sf0:#fff;--sf1:#f7f2f7;--sf2:#f2ecf1;--sf3:#ece7eb;--sf4:#e6e1e6;--okc:#b1f2a9;--on-okc:#002204;--warnc:#ffdf9e;--on-warnc:#261a00;--errc:#ffdad6;--on-errc:#410002;--spd:1;
 font-family:"Roboto Flex",system-ui,sans-serif;background:var(--sf);color:var(--on-sf);min-height:100%;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.app.dark{--p:#cfbcff;--on-p:#381e72;--pc:#4f378a;--on-pc:#e9ddff;--sc:#4a4458;--on-sc:#e8def8;--tc:#633b48;--on-tc:#ffd9e3;--sf:#141316;--on-sf:#e6e1e6;--mute:#cac4cf;--ol:#948f99;--olv:#49454e;--sf0:#0f0e11;--sf1:#1c1b1e;--sf2:#201f22;--sf3:#2b292d;--sf4:#363438;--okc:#12521a;--on-okc:#b1f2a9;--warnc:#5c4200;--on-warnc:#ffdf9e;--errc:#93000a;--on-errc:#ffb4ab}
@supports (color: color-mix(in oklch, red, blue)){.app{--p:color-mix(in oklch,var(--seed) 85%,#000);--pc:color-mix(in oklch,var(--seed) 22%,#fff);--sc:color-mix(in oklch,var(--seed) 14%,#eee)}.app.dark{--p:color-mix(in oklch,var(--seed) 55%,#fff);--pc:color-mix(in oklch,var(--seed) 55%,#000);--sc:color-mix(in oklch,var(--seed) 30%,#222)}}
.app *{box-sizing:border-box}
h1{font:800 34px/40px "Roboto Flex",sans-serif;margin:0;letter-spacing:-.01em}
h2{font:700 20px/26px "Roboto Flex",sans-serif;margin:0}
h3{font:700 16px/22px "Roboto Flex",sans-serif;margin:0}
p{margin:0}.small{font-size:13px;line-height:18px;color:var(--mute)}.mono{font-family:"Roboto Mono",monospace}
.eyebrow{font:700 11px/16px sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--p)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.card{background:var(--sf1);border-radius:32px;padding:22px;display:flex;flex-direction:column;gap:12px;transition:border-radius calc(240ms*var(--spd))}
.btn{min-height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--sc);color:var(--on-sc);font:650 14px/20px sans-serif;cursor:pointer;transition:border-radius calc(200ms*var(--spd)),transform calc(200ms*var(--spd))}
.btn:active{border-radius:12px;transform:scale(.97)}.btn.primary{background:var(--p);color:var(--on-p)}.btn.sm{min-height:40px;padding:0 16px;font-size:13px}
.btn.light{background:transparent;color:var(--p);box-shadow:inset 0 0 0 1px var(--ol)}.btn.danger{background:var(--errc);color:var(--on-errc)}
.icon{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:var(--p);display:grid;place-items:center;cursor:pointer}
.icon[aria-expanded="true"]{background:var(--sc);border-radius:14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:26px;background:var(--sf4)}.seg button{flex:1;min-height:44px;border:0;border-radius:22px;background:transparent;color:var(--on-sf);font:600 14px sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--p);color:var(--on-p)}
.field{display:flex;flex-direction:column;gap:6px;font:650 13px sans-serif;color:var(--mute)}
.inp{position:relative}.inp input{width:100%;height:56px;padding:0 48px 0 16px;border:0;border-radius:14px;background:var(--sf4);box-shadow:inset 0 -2px 0 var(--ol);color:var(--on-sf);font:15px "Roboto Mono",monospace}
.inp .x{position:absolute;right:4px;top:6px;width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:var(--mute);cursor:pointer}
.panel{background:var(--sf2);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 1px var(--olv)}
.anim .panel,.anim .rise{animation:rise calc(300ms*var(--spd)) cubic-bezier(.34,1.56,.64,1) both}
@keyframes rise{from{opacity:0;transform:translateY(-8px);border-radius:40px}}
.play{background:var(--sf0);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px var(--olv)}
.res{padding:10px 14px;border-radius:14px;font-size:14px}.res.ok{background:var(--okc);color:var(--on-okc)}.res.bad{background:var(--errc);color:var(--on-errc)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--mute);font-weight:650}.kv dd{margin:0}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;font:700 12px sans-serif;background:var(--sf4)}
.pill.ok{background:var(--okc);color:var(--on-okc)}.pill.warn{background:var(--warnc);color:var(--on-warnc)}.pill.bad{background:var(--errc);color:var(--on-errc)}
.warnbox{background:var(--warnc);color:var(--on-warnc);border-radius:20px;padding:12px 16px}
.prov{font-style:italic}
.steps li{color:var(--mute);margin:4px 0}.steps li.on{color:var(--on-sf);font-weight:650}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.dialog{width:min(540px,92%);background:var(--sf3);border-radius:36px;padding:26px;display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--on-sf);color:var(--sf);padding:12px 20px;border-radius:16px}
.bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-radius:28px;background:var(--sf3);align-self:flex-start;transition:border-radius calc(240ms*var(--spd)),padding calc(240ms*var(--spd))}
.tool{position:relative;width:48px;height:48px;border:0;border-radius:24px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--on-sf)}
.tool[aria-pressed="true"]{background:var(--sc);border-radius:14px}.tool .k{position:absolute;right:4px;bottom:2px;font:700 10px monospace;color:var(--mute)}
.nib{display:block;width:26px;border-radius:6px;background:var(--ink,#1d1b20)}
.sw{width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:grid;place-items:center;cursor:pointer}.sw i{width:28px;height:28px;border-radius:14px;display:block}.sw[aria-pressed="true"] i{border-radius:8px;box-shadow:0 0 0 3px var(--p)}
.disc{width:64px;height:64px;border:0;border-radius:32px;background:var(--pc);color:var(--on-pc);font-weight:700;cursor:pointer}
.board{border-radius:24px;background:var(--sf0);box-shadow:inset 0 0 0 1px var(--olv);width:100%;height:auto;display:block}
.list{display:flex;flex-direction:column;gap:12px}
.app.still *{animation:none!important;transition:none!important}
</style>
</helmet>
<div class="{{cls}}" style="--seed: {{seed}}; --spd: {{spd}}; position: relative;">
<div class="row"><div class="grow"><span class="eyebrow">Tools</span><h1>Drawing and annotation</h1></div><span class="small">{{status}}</span></div>
<div class="bar" role="toolbar" aria-label="Drawing tools">
<sc-if value="{{isPens}}" hint-placeholder-val="{{true}}"><sc-for list="{{pens}}" as="t" hint-placeholder-count="8"><button type="button" class="tool" aria-pressed="{{t.on}}" title="{{t.tip}}" aria-label="{{t.tip}}" onClick="{{t.pick}}"><span class="nib" style="height: {{t.h}}px; opacity: {{t.o}};"></span><span class="k">{{t.k}}</span></button></sc-for><button type="button" class="tool" title="Colours (C)" onClick="{{toPal}}"><span class="nib" style="width: 22px; height: 22px; border-radius: 11px; background: {{ink}};"></span></button><button type="button" class="tool" title="Minimise (M)" onClick="{{toDisc}}">&#x2212;</button></sc-if>
<sc-if value="{{isPal}}" hint-placeholder-val="{{false}}"><button type="button" class="tool" title="Back (Escape)" onClick="{{toPens}}">&#x2039;</button><sc-for list="{{cols}}" as="c" hint-placeholder-count="8"><button type="button" class="sw" aria-pressed="{{c.on}}" aria-label="{{c.v}}" onClick="{{c.pick}}"><i style="background: {{c.v}};"></i></button></sc-for></sc-if>
<sc-if value="{{isDisc}}" hint-placeholder-val="{{false}}"><button type="button" class="disc" title="Show the tools (M)" onClick="{{toPens}}">{{active}}</button></sc-if>
</div>
<svg class="board" viewBox="0 0 1000 500" role="img" aria-label="Sample board with one stroke per pen">
<sc-for list="{{strokes}}" as="s" hint-placeholder-count="7"><path d="{{s.d}}" fill="none" stroke="{{s.c}}" stroke-width="{{s.w}}" stroke-linecap="round" opacity="{{s.o}}"></path></sc-for>
<path d="M620 90 L820 290" stroke="#1d1b20" stroke-width="4" stroke-linecap="round"></path><text x="640" y="80" font-size="16" fill="currentColor">Shift locks to 45 degrees</text>
</svg>
<div class="row"><button type="button" class="btn sm">Undo (Ctrl+Z)</button><button type="button" class="btn sm">Redo (Ctrl+Y)</button><button type="button" class="btn sm">Export SVG</button><button type="button" class="btn sm">PNG 1x</button><button type="button" class="btn sm">PNG 2x</button><button type="button" class="btn sm">PNG 3x</button><button type="button" class="btn sm danger" onClick="{{clear}}">Clear (Shift+Delete)</button></div>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}"><div class="toast" role="status">{{toastText}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed": {"editor": "color", "default": "#6750A4"}, "dark": {"editor": "boolean", "default": false}, "motion": {"editor": "boolean", "default": true}, "$preview": {"width": 1280, "height": 860}}'>
class Component extends DCLogic {
  base() { const p = this.props, s = this.state; const dark = !!p.dark, motion = p.motion !== false; return { cls: 'app' + (dark ? ' dark' : '') + (motion ? ' anim' : ' still'), seed: p.seed || '#6750A4', spd: motion ? 1 : 0, toastText: s.toast || '', hasToast: !!s.toast }; }
  say(t) { this.setState({ toast: t }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 2400); }
  componentWillUnmount() { clearTimeout(this._tt); }
  renderVals() {
    const s = this.state, tool = s.tool || 'pen', shape = s.shape || 'pens', ink = s.ink || '#1d1b20';
    const P = [['pencil', 'Pencil', '1', 3, .85], ['pen', 'Pen', '2', 4, 1], ['fineliner', 'Fineliner', '3', 2, 1], ['marker', 'Marker', '4', 8, .92], ['highlighter', 'Highlighter', '5', 12, .4], ['brush', 'Brush', '6', 9, .95], ['fountain', 'Fountain Pen', '7', 6, 1], ['eraser', 'Eraser', 'E', 3, .3]];
    const C = ['#1d1b20', '#b3261e', '#e8590c', '#f2c94c', '#2e7d32', '#00838f', '#1e63d6', '#6750a4'];
    const cur = P.find((p) => p[0] === tool);
    return Object.assign(this.base(), {
      status: cur[1] + ' selected. Shortcuts 1 to 7, E, C, M.', ink,
      isPens: shape === 'pens', isPal: shape === 'pal', isDisc: shape === 'disc', active: cur[1].split(' ')[0],
      pens: P.map(([id, n, k, h, o]) => ({ on: String(id === tool), tip: n + ' (' + k + ')', k, h, o, pick: () => this.setState({ tool: id }) })),
      cols: C.map((v) => ({ v, on: String(v === ink), pick: () => this.setState({ ink: v, shape: 'pens' }) })),
      toPal: () => this.setState({ shape: 'pal' }), toDisc: () => this.setState({ shape: 'disc' }), toPens: () => this.setState({ shape: 'pens' }),
      strokes: P.slice(0, 7).map(([id, n, k, h, o], i) => ({ d: 'M40 ' + (50 + i * 62) + ' C 180 ' + (20 + i * 62) + ', 360 ' + (90 + i * 62) + ', 520 ' + (50 + i * 62), c: i === 4 ? '#f2c94c' : ink, w: h, o })),
      clear: () => this.say('Clear asks for the two-key confirmation when it would discard saved strokes.')
    });
  }
}
</script>
</body>
</html>
