<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
.app{--seed:#6750A4;--p:#6750a4;--on-p:#ffffff;--pc:#e9ddff;--on-pc:#22005d;--s:#625b71;--on-s:#ffffff;--sc:#e8def8;--on-sc:#1e192b;--t:#7e5260;--on-t:#ffffff;--tc:#ffd9e3;--on-tc:#31101d;--err:#ba1a1a;--on-err:#ffffff;--errc:#ffdad6;--on-errc:#410002;--sf:#fffbff;--on-sf:#1c1b1e;--on-sfv:#49454e;--ol:#7a757f;--olv:#cac4cf;--inv:#313033;--on-inv:#f4eff4;--inv-p:#cfbcff;--sf0:#ffffff;--sf1:#f7f2f7;--sf2:#f2ecf1;--sf3:#ece7eb;--sf4:#e6e1e6;--ok:#2e6b30;--on-ok:#ffffff;--okc:#b1f2a9;--on-okc:#002204;--warn:#7a5900;--on-warn:#ffffff;--warnc:#ffdf9e;--on-warnc:#261a00;}
.app.dark{--p:#cfbcff;--on-p:#381e72;--pc:#4f378a;--on-pc:#e9ddff;--s:#cbc2db;--on-s:#332d41;--sc:#4a4458;--on-sc:#e8def8;--t:#efb8c8;--on-t:#4a2532;--tc:#633b48;--on-tc:#ffd9e3;--err:#ffb4ab;--on-err:#690005;--errc:#93000a;--on-errc:#ffb4ab;--sf:#141316;--on-sf:#e6e1e6;--on-sfv:#cac4cf;--ol:#948f99;--olv:#49454e;--inv:#e6e1e6;--on-inv:#313033;--inv-p:#6750a4;--sf0:#0f0e11;--sf1:#1c1b1e;--sf2:#201f22;--sf3:#2b292d;--sf4:#363438;--ok:#96d68f;--on-ok:#00390a;--okc:#12521a;--on-okc:#b1f2a9;--warn:#f2bf48;--on-warn:#402d00;--warnc:#5c4200;--on-warnc:#ffdf9e;}
@supports (color: oklch(from red l c h)){.app{--p:oklch(from var(--seed) 0.47 0.15 h);--on-p:#ffffff;--pc:oklch(from var(--seed) 0.9 0.07 h);--on-pc:oklch(from var(--seed) 0.28 0.1 h);--s:oklch(from var(--seed) 0.47 0.05 h);--on-s:#ffffff;--sc:oklch(from var(--seed) 0.9 0.04 h);--on-sc:oklch(from var(--seed) 0.27 0.045 h);--t:oklch(from var(--seed) 0.47 0.13 calc(h + 75));--on-t:#ffffff;--tc:oklch(from var(--seed) 0.9 0.07 calc(h + 75));--on-tc:oklch(from var(--seed) 0.28 0.09 calc(h + 75));--sf:oklch(from var(--seed) 0.985 0.006 h);--on-sf:oklch(from var(--seed) 0.21 0.012 h);--on-sfv:oklch(from var(--seed) 0.4 0.02 h);--ol:oklch(from var(--seed) 0.56 0.02 h);--olv:oklch(from var(--seed) 0.83 0.02 h);--inv:oklch(from var(--seed) 0.3 0.012 h);--on-inv:oklch(from var(--seed) 0.95 0.01 h);--inv-p:oklch(from var(--seed) 0.8 0.12 h);--sf0:#ffffff;--sf1:oklch(from var(--seed) 0.968 0.01 h);--sf2:oklch(from var(--seed) 0.949 0.013 h);--sf3:oklch(from var(--seed) 0.93 0.015 h);--sf4:oklch(from var(--seed) 0.91 0.017 h);}.app.dark{--p:oklch(from var(--seed) 0.81 0.12 h);--on-p:oklch(from var(--seed) 0.3 0.11 h);--pc:oklch(from var(--seed) 0.38 0.11 h);--on-pc:oklch(from var(--seed) 0.92 0.05 h);--s:oklch(from var(--seed) 0.83 0.045 h);--on-s:oklch(from var(--seed) 0.3 0.04 h);--sc:oklch(from var(--seed) 0.36 0.04 h);--on-sc:oklch(from var(--seed) 0.92 0.03 h);--t:oklch(from var(--seed) 0.82 0.1 calc(h + 75));--on-t:oklch(from var(--seed) 0.3 0.08 calc(h + 75));--tc:oklch(from var(--seed) 0.38 0.09 calc(h + 75));--on-tc:oklch(from var(--seed) 0.92 0.05 calc(h + 75));--sf:oklch(from var(--seed) 0.17 0.008 h);--on-sf:oklch(from var(--seed) 0.93 0.01 h);--on-sfv:oklch(from var(--seed) 0.81 0.02 h);--ol:oklch(from var(--seed) 0.63 0.02 h);--olv:oklch(from var(--seed) 0.38 0.02 h);--inv:oklch(from var(--seed) 0.92 0.01 h);--on-inv:oklch(from var(--seed) 0.25 0.01 h);--inv-p:oklch(from var(--seed) 0.47 0.15 h);--sf0:oklch(from var(--seed) 0.13 0.006 h);--sf1:oklch(from var(--seed) 0.195 0.008 h);--sf2:oklch(from var(--seed) 0.215 0.01 h);--sf3:oklch(from var(--seed) 0.25 0.012 h);--sf4:oklch(from var(--seed) 0.285 0.014 h);}}
.app.dark{--ok:#8fd88a;--on-ok:#00390a;--okc:#1d5a22;--on-okc:#c4f5bc;--warn:#f2c04e;--on-warn:#402d00;--warnc:#5c4200;--on-warnc:#ffe08f;--err:#ffb4ab;--on-err:#690005;--errc:#93000a;--on-errc:#ffdad6}
.app{--ok:#2a6a2e;--on-ok:#ffffff;--okc:#bdf1b4;--on-okc:#002204;--warn:#775700;--on-warn:#ffffff;--warnc:#ffdf9e;--on-warnc:#261a00;--err:#ba1a1a;--on-err:#ffffff;--errc:#ffdad6;--on-errc:#410002}

body{margin:0;background:#1a181d}
.app{font-family:"Roboto Flex",system-ui,sans-serif;background:var(--sf);color:var(--on-sf);min-height:100vh;display:flex;--r-card:24px;--r-ctl:20px}
.app *{box-sizing:border-box}
.app.still *{animation:none!important;transition:none!important}
.rail{width:88px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0;background:var(--sf1)}
.rail .mk{width:56px;height:56px;border-radius:16px;border:0;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;margin-bottom:12px}
.rail .it{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px/16px inherit;color:var(--on-sfv);padding:4px 0 8px}
.rail .it .ic{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
.rail .it.on{color:var(--on-sf)}.rail .it.on .ic{background:var(--sc);color:var(--on-sc)}
.rail .hv{margin-top:auto;font:600 11px/14px inherit;color:var(--on-sfv);text-align:center;padding:0 6px}
.main{flex:1;min-width:0;padding:20px 32px 120px;display:flex;flex-direction:column;gap:16px;background:var(--sf0);border-radius:28px 0 0 0;margin-top:8px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{margin:0;font:700 32px/40px inherit;letter-spacing:-.01em}
.sum{display:flex;gap:6px;flex-wrap:wrap}
.sum span{height:28px;padding:0 12px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;font:600 13px/16px inherit;background:var(--sf2);color:var(--on-sfv)}
.sum b{color:var(--on-sf);font-variant-numeric:tabular-nums}
.grow{flex:1}
.srch{flex:0 1 420px;min-width:0;height:48px;border-radius:24px;background:var(--sf3);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;color:var(--on-sfv);font:500 15px/20px inherit}
.srch .rx{margin-left:auto;height:36px;padding:0 12px;border-radius:18px;background:var(--sf0);font:600 13px/16px "Roboto Mono",monospace;display:grid;place-items:center}
.ib{height:48px;min-width:48px;border-radius:24px;border:1px solid var(--olv);background:transparent;color:var(--on-sf);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font:600 14px/20px inherit}
.ib kbd{font:600 11px/16px "Roboto Mono",monospace;padding:2px 6px;border-radius:6px;background:var(--sf3)}
.btn{height:40px;border-radius:20px;border:0;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font:600 14px/20px inherit;cursor:pointer;background:transparent;color:var(--p)}
.btn.fill{background:var(--p);color:var(--on-p)}
.btn.tonal{background:var(--sc);color:var(--on-sc)}
.btn.lg{height:48px;border-radius:24px;padding:0 20px}
.btn:disabled{color:color-mix(in srgb,var(--on-sf) 38%,transparent);background:transparent}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{height:32px;border-radius:8px;border:1px solid var(--olv);background:transparent;color:var(--on-sfv);padding:0 12px;display:inline-flex;align-items:center;gap:8px;font:600 13px/16px inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sc);color:var(--on-sc);border-color:transparent}
.chip .n{font-variant-numeric:tabular-nums;opacity:.8}
.note{font:500 13px/18px inherit;color:var(--on-sfv)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{border-radius:var(--r-card);background:var(--sf1);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid transparent;animation:rise .4s cubic-bezier(.05,.7,.1,1) both;animation-delay:calc(var(--i,0)*50ms)}
.card:hover{border-color:var(--olv)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.top{display:flex;align-items:center;gap:12px;min-width:0}
.os{width:40px;height:40px;border-radius:12px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;flex:none}
.id{flex:1;min-width:0;display:flex;flex-direction:column}
.id b{font:650 20px/26px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id small{font:500 12px/16px inherit;color:var(--on-sfv)}
.pill{height:24px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font:650 12px/16px inherit;white-space:nowrap}
.pill.run{background:var(--pc);color:var(--on-pc)}.pill.idle{background:var(--sf3);color:var(--on-sfv)}.pill.duty{background:var(--warnc);color:var(--on-warnc)}.pill.bad{background:var(--errc);color:var(--on-errc)}.pill.busy{background:var(--tc);color:var(--on-tc)}
.pill i{width:6px;height:6px;border-radius:3px;background:currentColor}
.kb{width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--on-sfv);display:grid;place-items:center}
.addr{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 4px 4px 14px;border-radius:14px;background:var(--sf2)}
.addr .ip{flex:1;font:600 18px/24px "Roboto Mono",monospace}
.addr .ip.off{font:500 14px/20px inherit;color:var(--on-sfv)}
.addr .tag{font:600 12px/16px inherit;color:var(--on-sfv);padding:0 8px}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 13px/18px inherit;color:var(--on-sfv)}
.facts .ok{color:var(--ok)}.facts .err{color:var(--err)}
.prog{height:4px;border-radius:2px;background:var(--sf3);overflow:hidden}.prog i{display:block;height:100%;background:var(--t);width:var(--w)}
.acts{display:flex;align-items:center;gap:4px;flex-wrap:wrap;border-top:1px solid var(--olv);padding-top:10px;margin-top:auto}
.acts .grow{min-width:8px}
.split{display:inline-flex;gap:2px}.split .btn:first-child{border-radius:20px 6px 6px 20px}.split .btn:last-child{border-radius:6px 20px 20px 6px;padding:0 10px}
.fab{position:fixed;right:24px;bottom:24px;height:56px;border-radius:16px;border:0;background:var(--pc);color:var(--on-pc);display:inline-flex;align-items:center;gap:10px;padding:0 20px;font:650 15px/20px inherit;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.phone .rail{display:none}
.phone .main{padding:12px 16px 112px;border-radius:0;margin:0;gap:12px}
.phone .bar h1{font-size:28px;line-height:36px}
.phone .srch{flex:1 1 100%}
.phone .grid{grid-template-columns:1fr;gap:12px}
.phone .tools{flex-wrap:nowrap;overflow-x:auto}
.phone .nav{position:fixed;left:0;right:0;bottom:0;height:80px;background:var(--sf2);display:flex;justify-content:space-around;align-items:center}
.phone .nav .it{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px/16px inherit;color:var(--on-sfv)}
.phone .nav .it .ic{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.phone .nav .it.on .ic{background:var(--sc);color:var(--on-sc)}
.phone .fab{bottom:96px;right:16px}
.states{padding:32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;background:var(--sf0);flex:1}
.states h2{grid-column:1/-1;margin:0;font:700 28px/36px inherit}
.states .cap{font:600 12px/16px inherit;color:var(--on-sfv);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

</style>
</helmet>
<div class="{{cls}}" style="--seed: {{seed}};">
<main class="main"><header class="bar"><h1>Machines</h1><div class="sum" role="group" aria-label="Machines at a glance"><span><b>{{run}}</b> running</span><span><b>{{idle}}</b> idle</span><span><b>{{duty}}</b> on runner duty</span></div><span class="grow"></span>
  <div class="srch"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>Search machines<span class="rx">.* regex</span></div>
  <button type="button" class="ib" aria-label="Commands"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8"></path></svg></button>
  </header>
<div class="tools" role="group" aria-label="Filter machines"><sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><button type="button" class="chip" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.l}}<span class="n">{{c.n}}</span></button></sc-for><span class="grow"></span><span class="note">{{lastBuild}}</span></div><div class="grid"><sc-for list="{{cards}}" as="m" hint-placeholder-count="3"><article class="card" style="--i: {{m.i}};" aria-label="{{m.name}}">
  <div class="top"><span class="os"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></span><div class="id"><b>{{m.name}}</b><small>{{m.project}}</small></div><span class="{{m.pillCls}}"><i></i>{{m.pill}}</span><button type="button" class="kb" aria-label="More options for {{m.name}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6h.01M12 12h.01M12 18h.01"></path></svg></button></div>
  <div class="addr"><span class="{{m.ipCls}}">{{m.ip}}</span><span class="tag">{{m.net}}</span><sc-if value="{{m.hasIp}}" hint-placeholder-val="{{true}}"><button type="button" class="kb" aria-label="Copy the IP address"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h11v11H9zM5 15H4V4h11v1"></path></svg></button></sc-if></div>
  <sc-if value="{{m.busy}}" hint-placeholder-val="{{false}}"><div class="prog" style="--w: {{m.pct}}%;"><i></i></div></sc-if>
  <div class="facts"><span class="{{m.lastCls}}">{{m.last}}</span><span>{{m.hv}}</span><span>{{m.spec}}</span><span>{{m.who}}</span></div>
  <div class="acts"><button type="button" class="btn">Open</button><button type="button" class="btn" disabled="{{m.locked}}">{{m.power}}</button><button type="button" class="btn" disabled="{{m.locked}}">Reset</button><button type="button" class="btn">Fresh build</button><span class="grow"></span>
    <sc-if value="{{m.on}}" hint-placeholder-val="{{true}}"><span class="split"><button type="button" class="btn fill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v11H3zM8 20h8M12 16v4"></path></svg>Remote Desktop</button><button type="button" class="btn fill" aria-label="More actions"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></span></sc-if>
    <sc-if value="{{m.off}}" hint-placeholder-val="{{false}}"><button type="button" class="btn tonal" disabled="{{m.locked}}">Start</button></sc-if>
  </div>
</article></sc-for></div></main><button type="button" class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create</button><nav class="nav" aria-label="Sections"><span class="it on"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v11H3zM8 20h8M12 16v4"></path></svg></span>Machines</span><span class="it"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM10 8.5v7l6-3.5z"></path></svg></span>Runners</span><span class="it"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"></path></svg></span>Receipts</span><span class="it"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6h.01M12 12h.01M12 18h.01"></path></svg></span>More</span></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"color","default":"#6750A4"},"dark":{"editor":"boolean","default":false},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'all' }; }
  machines() { return [
    { name: 'proof-1', project: 'owner/my-app', st: 'running', ip: '192.0.2.10', net: 'NAT', hv: 'VMware 17.6', spec: '8 GB, 4 vCPU', who: 'For Claude', last: 'Build passed, 14 min', lastCls: 'ok', runners: 0 },
    { name: 'installer-check', project: 'owner/my-app', st: 'stopped', ip: 'Off, no address', net: 'NAT', hv: 'VMware 17.6', spec: '8 GB, 4 vCPU', who: 'For you', last: 'No fresh build yet', lastCls: '', runners: 0 },
    { name: 'runner-1', project: 'owner/my-api', st: 'running', ip: '192.0.2.36', net: 'Host-only', hv: 'VirtualBox 7.1', spec: '16 GB, 8 vCPU', who: 'For an agent', last: 'Runner idle, last job 4 min ago', lastCls: '', runners: 1 },
    { name: 'proof-2', project: 'general', st: 'creating', ip: 'Waiting for an address', net: 'NAT', hv: 'VMware 17.6', spec: '8 GB, 4 vCPU', who: 'For you', last: 'Unattended install, 48 percent', lastCls: '', runners: 0, pct: 48 },
    { name: 'srv-25', project: 'owner/my-installer', st: 'failed', ip: 'Off, no address', net: 'Bridged', hv: 'VMware 17.6', spec: '16 GB, 12 vCPU', who: 'For you', last: 'Build failed: build.bat exited 1', lastCls: 'err', runners: 0 }
  ]; }
  card(m, i) {
    const on = m.st === 'running', duty = m.runners > 0;
    const [pill, pc] = duty ? ['Runner on duty', 'duty'] : on ? ['Running', 'run'] : m.st === 'creating' ? ['Creating', 'busy'] : m.st === 'failed' ? ['Failed', 'bad'] : ['Idle', 'idle'];
    return Object.assign({}, m, { i, on: on, off: !on, hasIp: on, ipCls: on ? 'ip' : 'ip off', pill, pillCls: 'pill ' + pc, busy: m.st === 'creating', locked: m.st === 'creating', power: on ? 'Stop' : 'Start' });
  }
  renderVals() {
    const p = this.props, s = this.state, all = this.machines();
    const run = all.filter((m) => m.st === 'running').length, duty = all.filter((m) => m.runners > 0).length;
    const pick = (f) => () => this.setState({ f });
    const shown = all.filter((m) => s.f === 'all' || (s.f === 'running' && m.st === 'running') || (s.f === 'runner' && m.runners > 0));
    return Object.assign({
      cls: 'app' + (p.dark ? ' dark' : '') + (p.motion === false ? ' still' : '') + ' phone', seed: p.seed || '#6750A4',
      run, idle: all.length - run, duty, lastBuild: 'Last fresh build: passed on proof-1, 14 min',
      chips: [['all', 'All', all.length], ['running', 'Running', run], ['runner', 'Runners', duty]].map(([id, l, n]) => ({ l, n, on: s.f === id ? 'true' : 'false', pick: pick(id) })),
      cards: shown.map((m, i) => this.card(m, i)),
      states: all.map((m, i) => this.card(m, i))
    });
  }
}
</script>
</body>
